name: Node.js tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  tests:
    name: Test / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Run mocked test suite
        run: node --test

  dotnet-regression:
    name: Test / Windows / .NET 8
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          architecture: x64

      - name: Build Approval Agent Mock tests
        run: dotnet build .\approval-agent\ApprovalAgent.MockTests\ApprovalAgent.MockTests.csproj --configuration Release

      - name: Run Approval Agent Mock tests
        run: dotnet run --no-build --no-restore --configuration Release --project .\approval-agent\ApprovalAgent.MockTests\ApprovalAgent.MockTests.csproj

      - name: Build WebAuthn Fake Lab
        run: dotnet build .\experiments\webauthn-windows-lab\WebAuthn.WindowsLab.csproj --configuration Release

      - name: Run WebAuthn Fake Lab tests
        run: dotnet run --no-build --no-restore --configuration Release --project .\experiments\webauthn-windows-lab\WebAuthn.WindowsLab.csproj
